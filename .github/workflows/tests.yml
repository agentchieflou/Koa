# Koa's tests (this-next-please#600): the Power App sources, the flows, the workbook and the pinned contract, on
# Ubuntu and on Windows with core.autocrlf=true (the operator's laptop checkout). Plain pytest, about two minutes.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Set before the checkout so it rewrites what it may: .gitattributes (`* -text`) must keep every byte exact,
      # and the tests (LF, sha256 against contract/PIN) fail if it does not.
      - name: core.autocrlf=true, as a Windows laptop has it
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
